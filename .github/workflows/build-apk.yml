name: Build Android APK from HTML

on:
  repository_dispatch:
    types: [build_apk]

# អនុញ្ញាតឲ្យ GitHub Actions មានសិទ្ធិ Push File ចូលទៅក្នុង Branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova and Create Project
        run: |
          npm install -g cordova
          # បង្កើត Project ដោយប្រើ Package Name និង App Name ដែលផ្ញើពី UI
          cordova create myapp "${{ github.event.client_payload.packageName }}" "${{ github.event.client_payload.appName }}"
          cd myapp
          cordova platform add android

      - name: Write HTML, Icon, and Modify Config.xml
        run: |
          cd myapp
          
          # 1. Decode HTML
          echo "${{ github.event.client_payload.html }}" | base64 --decode > www/index.html
          
          # 2. Decode Icon (if exists)
          if [ "${{ github.event.client_payload.icon }}" != "none" ]; then
            echo "${{ github.event.client_payload.icon }}" | base64 --decode > www/icon.png
          fi

          # 3. Modify config.xml using Node.js to apply Version and Icon
          node -e "
            const fs = require('fs');
            let config = fs.readFileSync('config.xml', 'utf8');
            
            // Apply Custom Version
            config = config.replace(/version=\"[^\"]+\"/, 'version=\"${{ github.event.client_payload.version }}\"');
            
            // Add Icon configuration if icon was uploaded
            if ('${{ github.event.client_payload.icon }}' !== 'none') {
               config = config.replace('</widget>', '    <icon src=\"www/icon.png\" />\n</widget>');
            }
            
            fs.writeFileSync('config.xml', config);
          "

      - name: Build Android APK (Force APK Format)
        run: |
          cd myapp
          # [កន្លែងសំខាន់!] ថែម -- --packageType=apk ដើម្បិបង្ខំឲ្យវាចេញជា .apk ដាច់ខាត!
          cordova build android --release -- --packageType=apk

      - name: Upload and Publish APK to Branch
        run: |
          mkdir -p release-apks
          
          echo "កំពុងស្វែងរក File APK ទូទាំង Project..."
          
          # ស្វែងរក File APK ទូទាំង Project
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: រកមិនឃើញ File APK ទាល់តែសោះ! សូមពិនិត្យមើល Log..."
            # បង្ហាញ File ទាំងអស់ដែល Cordova បានបង្កើត ដើម្បីងាយស្រួលរកមើលកំហុស
            find myapp/platforms/android/app/build/outputs/ -type f
            exit 1
          fi
          
          echo "ជោគជ័យ! រកឃើញ APK នៅទីតាំង៖ $APK_PATH"
          
          # Copy File ទៅកាន់ Folder គោលដៅ
          cp "$APK_PATH" release-apks/build_${{ github.event.client_payload.buildId }}.apk
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch ដើម្បីធានាថាវាស្គាល់ Branch រួចធ្វើការ Push ឡើង
          git fetch origin
          git checkout -B apk-releases
          git add release-apks/build_${{ github.event.client_payload.buildId }}.apk
          git commit -m "Build APK for ID: ${{ github.event.client_payload.buildId }}"
          git push origin apk-releases --force
