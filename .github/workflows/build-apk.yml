name: Build Android APK from HTML

on:
  repository_dispatch:
    types: [build_apk]

# អនុញ្ញាតឲ្យ GitHub Actions មានសិទ្ធិ Push File ចូលទៅក្នុង Branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova and Create Project
        run: |
          npm install -g cordova
          # បង្កើត Project ដោយប្រើ Package Name និង App Name ដែលផ្ញើពី UI
          cordova create myapp "${{ github.event.client_payload.packageName }}" "${{ github.event.client_payload.appName }}"
          cd myapp
          cordova platform add android

      - name: Write HTML, Icon, and Modify Config.xml
        run: |
          cd myapp
          
          # 1. Decode HTML
          echo "${{ github.event.client_payload.html }}" | base64 --decode > www/index.html
          
          # 2. Decode Icon (if exists)
          if [ "${{ github.event.client_payload.icon }}" != "none" ]; then
            echo "${{ github.event.client_payload.icon }}" | base64 --decode > www/icon.png
          fi

          # 3. Modify config.xml using Node.js to apply Version and Icon
          node -e "
            const fs = require('fs');
            let config = fs.readFileSync('config.xml', 'utf8');
            
            // Apply Custom Version
            config = config.replace(/version=\"[^\"]+\"/, 'version=\"${{ github.event.client_payload.version }}\"');
            
            // Add Icon configuration if icon was uploaded
            if ('${{ github.event.client_payload.icon }}' !== 'none') {
               config = config.replace('</widget>', '    <icon src=\"www/icon.png\" />\n</widget>');
            }
            
            fs.writeFileSync('config.xml', config);
          "

      - name: Build Android APK (Debug Mode)
        run: |
          cd myapp
          # 🔴 ប្ដូរមកប្រើ --debug ដើម្បីឱ្យ Android Auto-Sign APK (អាច Install បាន ១០០%)
          cordova build android --debug -- --packageType=apk

      - name: Upload, Clean Old Files and Publish
        run: |
          echo "កំពុងស្វែងរក File APK ទូទាំង Project..."
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: រកមិនឃើញ File APK ទាល់តែសោះ! សូមពិនិត្យមើល Log..."
            exit 1
          fi
          
          echo "ជោគជ័យ! រកឃើញ APK នៅទីតាំង៖ $APK_PATH"
          
          # Setup Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ទាញយក Branch: apk-releases មកសិន (ទើបអាចលុប file ចាស់ៗនៅក្នុងហ្នឹងបាន)
          git fetch origin
          if git ls-remote --heads origin apk-releases | grep -q apk-releases; then
            git checkout apk-releases
            git pull origin apk-releases --rebase
          else
            git checkout -b apk-releases
          fi
          
          # បង្កើត Folder សម្រាប់ផ្ទុក
          mkdir -p release-apks
          
          # ចម្លង File APK ថ្មីចូលទៅក្នុង Folder នោះ
          cp "$APK_PATH" release-apks/build_${{ github.event.client_payload.buildId }}.apk
          
          # 🔴 សំខាន់៖ រក្សាទុកតែ ៥ File ចុងក្រោយប៉ុណ្ណោះ រួចលុប File ចាស់ៗចោល ដើម្បីកុំឱ្យពេញទំហំ GitHub
          ls -t release-apks/*.apk | tail -n +6 | xargs -r rm -f
          
          # Add, Commit ទាំង File ថ្មីដែលបានថែម និង File ចាស់ដែលត្រូវបានលុប
          git add release-apks/
          git commit -m "Build APK for ID: ${{ github.event.client_payload.buildId }} & Auto-Clean old APKs" || echo "No changes to commit"
          
          # Push ចូលទៅ Branch apk-releases
          git push origin apk-releases
