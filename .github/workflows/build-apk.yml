name: Build HTML to APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Project & Inject Code
      run: |
        cordova create myapp com.freerun.builder FreeRunApp
        cd myapp
        cordova platform add android
        rm -rf www/*
        
        # ទទួលកូដពី App របស់អ្នកមកបង្កើតជា File ក្នុង Cordova
        echo '${{ github.event.client_payload.html }}' > www/index.html
        echo '${{ github.event.client_payload.css }}' > www/style.css
        echo '${{ github.event.client_payload.js }}' > www/index.js
        
        # កែសម្រួលឱ្យ index.html ហៅ style និង script ដោយស្វ័យប្រវត្តិ
        sed -i '</head>/i <link rel="stylesheet" href="style.css">' www/index.html
        sed -i '</body>/i <script src="index.js"></script>' www/index.html

    - name: Build APK
      run: |
        cd myapp
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
