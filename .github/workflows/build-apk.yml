name: Build Android APK from HTML

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova (For converting HTML to APK)
        run: |
          npm install -g cordova
          cordova create myapp com.example.myapp "${{ github.event.client_payload.appName }}"
          cd myapp
          cordova platform add android

      - name: Write HTML & Icon Code from Payload
        run: |
          cd myapp
          # Decode HTML from Base64
          echo "${{ github.event.client_payload.html }}" | base64 --decode > www/index.html
          
          # Decode Icon from Base64 (if provided)
          if [ "${{ github.event.client_payload.icon }}" != "none" ]; then
            echo "${{ github.event.client_payload.icon }}" | base64 --decode > www/icon.png
            # Code to replace the Cordova App Icon...
          fi

      - name: Build Android APK
        run: |
          cd myapp
          cordova build android --release

      - name: Upload and Publish APK to Branch
        run: |
          # Create a directory to store the APK
          mkdir -p release-apks
          cp myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/build_${{ github.event.client_payload.buildId }}.apk
          
          # Push the APK file to the `apk-releases` branch so the raw.githubusercontent link works
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create or switch to the apk-releases branch
          git checkout -B apk-releases
          git add release-apks/build_${{ github.event.client_payload.buildId }}.apk
          git commit -m "Build APK for ID: ${{ github.event.client_payload.buildId }}"
          git push origin apk-releases --force
