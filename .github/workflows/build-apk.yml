name: Build Android APK from HTML

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-style: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova or Capacitor (សម្រាប់បំប្លែង HTML ទៅ APK)
        run: |
          npm install -g cordova
          cordova create myapp com.example.myapp "${{ github.event.client_payload.appName }}"
          cd myapp
          cordova platform add android

      - name: Write HTML & Icon Code from Payload
        run: |
          cd myapp
          # បកប្រែ HTML ពី Base64 មកវិញ
          echo "${{ github.event.client_payload.html }}" | base64 --decode > www/index.html
          
          # បកប្រែ Icon ពី Base64 (ប្រសិនបើមាន)
          if [ "${{ github.event.client_payload.icon }}" != "none" ]; then
            echo "${{ github.event.client_payload.icon }}" | base64 --decode > www/icon.png
            # កូដសម្រាប់ជំនួស Icon របស់ Cordova App...
          fi

      - name: Build Android APK
        run: |
          cd myapp
          cordova build android --release

      - name: Upload and Publish APK to Branch
        run: |
          # បង្កើត Folder សម្រាប់ផ្ទុក APK
          mkdir -p release-apks
          cp myapp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/build_${{ github.event.client_payload.buildId }}.apk
          
          # Push ឯកសារ APK ទៅកាន់ Branch `apk-releases` ដើម្បីឱ្យ Link របស់ raw.githubusercontent ដំណើរការ
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # បង្កើត ឬ Switch ទៅកាន់ branch apk-releases
          git checkout -B apk-releases
          git add release-apks/build_${{ github.event.client_payload.buildId }}.apk
          git commit -m "Build APK for ID: ${{ github.event.client_payload.buildId }}"
          git push origin apk-releases --force
